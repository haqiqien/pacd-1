name: Deploy GitHub Pages

# Deploy otomatis saat ada perubahan di branch main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Izin untuk mengunggah dan menerbitkan artifact Pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ambil file repository
        uses: actions/checkout@v6

      - name: Siapkan GitHub Pages
        uses: actions/configure-pages@v5

      # Terbitkan isi folder html sebagai situs statis.
      - name: Unggah file situs
        uses: actions/upload-pages-artifact@v4
        with:
          path: html

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
